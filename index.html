<!DOCTYPE html>
<head>
<link rel="shortcut icon" href="ScaleWizardIcon.png" type="image/x-icon">
<title>Scale Wizard</title>
<style>
*{
	margin:0px;
	padding:0px;
}
body{
	overflow:hidden;
}
canvas{
	width:100vw;
	height:100vh;
}
.scale_selector{
	position:fixed;
	left:20px;
	top:5px;
}
.scale_selector *{
	background-color:purple;
	color:white;
	border: 2px solid yellow;
	z-index:1000;
	padding: 8px 16px;
	font-weight:bold;
}
.draw_scale_button, .clear_markers_button{
	background-color:purple;
	color:white;
	border: 2px solid yellow;
	padding:8px 16px;
	position:fixed;
	z-index:1000;
	font-weight:bold;
	border-radius:12px;
}
.draw_scale_button{
	top:5px;
	left:300px;
}
.clear_markers_button{
	top:5px;
	left:500px;
}
footer{
	position:fixed;
	bottom:5px;
	z-index:1002;
	color:white;
}
footer a{
	color:white;
}
.customCheckbox{
	position:fixed;
	top:5px;
	left:5px;
	z-index:1001;
	color:white;
}
.customCheckbox div{
	width:25px;
	height:25px;
	text-align:center;
	background-color:purple;
	color:white;
	border-radius:12px;
	border:2px solid yellow;
}
.fretHitbox{
	display:block;
	z-index:1004;
	text-align:center;
	color:white;
	background-color:rgba(17, 171, 242, 100);
	visibility:hidden;
}
.fretHitbox:hover{
	visibility:visible;
}
</style>
<script src='logic.js'></script>
<script>
var myCanvas;
var c; // canvas context
var scaleSelectorComboBox;
var rootSelectorComboBox;
var showLeftHandedCheckbox;
var showOnly1ScaleCheckbox;
var showNoteNamesCheckbox;
var scalePlayer = undefined;
var fretboard;
const stringPositions = [401, 415, 431, 445, 459, 474];
const fretPositions = [79, 143, 217, 284, 349, 409, 465, 518, 570, 616, 660, 705, 741, 782, 816, 847, 878, 907, 938, 963, 987, 1012, 1034];
const markerRadius = 11; // pixels max due to fretboard image size constraints
const markerOctaveColorCode = ['gray', 'black', 'brown', 'purple', 'green', 'blue', 'red', 'orange']; // note: there is no octave 0
const hitboxWidth = 12;
const hitboxHeight = 10;
var currentScale = "";
var currentNotes = [];

function Marker(color, text, x, y, note){
	this.color = color;
	this.text = text;
	this.note = note;
	this.x = x;
	this.y = y;
}

function Hitbox2D(x, y, w, h){
	this.x = x;
	this.y = y;
	this.w = w;
	this.h = h;
	
	this.isInside = function(x, y){
		return (x >= this.x && x <= this.x + this.w)
		&&
		(y >= this.y && y <= this.y + this.h);
	}
}

function Fret(noteIndex, octave, x, y){
	this.note = noteIndex;
	this.octave = octave;
	this.x = x;
	this.y = y;
	
	this.hitbox = new Hitbox2D(x - hitboxWidth/2, y - hitboxHeight/2, hitboxWidth, hitboxHeight);
	/* DEBUG
	this.hitboxDiv = document.createElement('div');
	this.hitboxDiv.className = "fretHitbox";
	this.hitboxDiv.style.position = "absolute";
	this.hitboxDiv.style.left = this.hitbox.x + "px";
	this.hitboxDiv.style.top = this.hitbox.y + "px";
	this.hitboxDiv.style.width = this.hitbox.w;
	this.hitboxDiv.style.height = this.hitbox.h;
	//this.hitboxDiv.style.visibility = "visible";
	this.hitboxDiv.innerHTML = noteNames[noteIndex];
	document.body.appendChild(this.hitboxDiv);
	console.log("New hitbox: ", this.hitboxDiv);
	*/
}

// main wrapper for all visual elements
function Imagery(){
	this.fretboardImage = new Image();
	this.fretboard_x = 0;
	this.fretboard_y = 0;
	this.fretboard_scale = 1.0;
	this.fretboard_w = 1184;
	this.fretboard_h = 864;
	
	// zoom in and out and pan by %
	this.fretboard_zoom = 1.0;
	this.fretboard_zoom_max = 3.76;
	this.fretboard_zoom_min = 1.0;
	
	this.fretboard_pan_x = 0.0;
	this.fretboard_pan_min = 0.0;
	this.fretboard_pan_max = 1.0;
	
	this.fretCount = 22; // frets on this fretboard model
	this.strings = 6;
	this.stringTuning = [noteIndices['E'], noteIndices['B'], noteIndices['G'], noteIndices['D'], noteIndices['A'], noteIndices['E']];
	this.stringOctaves = [4, 3, 3, 3, 2, 2];
	this.inlayFrets = [3, 5, 7, 9, 12, 15, 17, 19, 21]; // a marker is shown above these fret indices
	this.frets = [];
	
	// high e = 0, low E = 5
	for(var stringIndex = 0;stringIndex < this.strings;stringIndex++){
		let note = this.stringTuning[stringIndex];
		let octave = this.stringOctaves[stringIndex];
		
		for(var fretIndex = 0;fretIndex <= this.fretCount;fretIndex++){
			this.frets.push(new Fret(note, octave, fretPositions[fretIndex], stringPositions[stringIndex]));
			
			// increment this string's note for the next fret
			note++;
			if(note == 12){
				note = 0; // wrap around to C
				octave++; // and increase the octave
			}
		}
	}
	
	// higher hitbox for the entire fretboard
	this.fretboardHitbox = new Hitbox2D(this.frets[0].hitbox.x,
	this.frets[0].hitbox.y,
	this.frets[this.frets.length-1].hitbox.x - this.frets[0].hitbox.x + hitboxWidth,
	this.frets[this.frets.length-1].hitbox.y - this.frets[0].hitbox.y + hitboxHeight);
	
	
	this.markers = []; // frets to be 'highlighted' via marker overlays
	
	// update the canvas screen
	this.draw = function(){
		console.log("DEBUG: draw()");
		c.drawImage(this.fretboardImage, 0, 0);
		
		// draw markers (highlighted frets)
		console.log("DEBUG: drawing " + this.markers.length + " markers.");
		for(var markerIndex = 0, markerCount = this.markers.length;markerIndex < markerCount;markerIndex++){
			c.beginPath();
			
			// set the circle area/path
			c.arc(this.markers[markerIndex].x, this.markers[markerIndex].y, markerRadius, 0, 2 * Math.PI);
			
			// fill with color
			c.fillStyle = this.markers[markerIndex].color;
			c.fill();
			
			// draw an outline around the circle
			c.lineWidth = 2;
			c.strokeStyle = 'black';
			c.stroke();
			
			// draw the marker text
			c.font = "bold 20px sans-serif";
			c.fillStyle = "white";
			c.textAlign = "center";
			c.textBaseline = "middle";
			c.fillText(this.markers[markerIndex].text, this.markers[markerIndex].x, this.markers[markerIndex].y);
			
			//c.strokeStyle = "white";
			//c.strokeText(this.markers[markerIndex].text, this.markers[markerIndex].x, this.markers[markerIndex].y);
			
		}
		
		/*
		c.fillStyle = "pink";
		c.fillRect(this.fretboardHitbox.x,
			this.fretboardHitbox.y,
			this.fretboardHitbox.w,
			this.fretboardHitbox.h);
		
		// fret-hover hitbox & note name
		for(var fretIndex=0, len = this.frets.length;fretIndex < len;fretIndex++){
			c.fillStyle = "green";
			c.fillRect(this.frets[fretIndex].hitbox.x,
				this.frets[fretIndex].hitbox.y,
				this.frets[fretIndex].hitbox.w,
				this.frets[fretIndex].hitbox.h);
		}
		*/
		
		
		
		// draw the fret inlay markers
		for(inlayIndex = 0, inlayCount = this.inlayFrets.length;inlayIndex < inlayCount;inlayIndex++){
			// background rectangle
			let rectangle = new Hitbox2D(this.frets[this.inlayFrets[inlayIndex]].x - 16, this.frets[0].y - 16 - 50, 32, 32);
			/*
			let gradient = c.createLinearGradient(rectangle.x, rectangle.y, rectangle.x + rectangle.w, rectangle.y);
			gradient.addColorStop(0, "#2A2D3C");
			gradient.addColorStop(0.75, "#414A59");
			gradient.addColorStop(0.9, "#4D9BA5");
			gradient.addColorStop(1, "#45D2CC");
			*/
			
			// switch to Radial Gradient
			let centerX = rectangle.x;
			let centerY = rectangle.y;
			let radius = rectangle.w;
			let gradient = c.createRadialGradient(centerX, centerY, radius, centerX, centerY, radius*2);
			gradient.addColorStop(0, "#2A2D3C");
			gradient.addColorStop(0.25, "#414A59");
			gradient.addColorStop(0.5, "#4D9BA5");
			gradient.addColorStop(0.1, "#45D2CC");
	
	
			c.fillStyle = gradient;
			c.fillRect(rectangle.x, rectangle.y, rectangle.w, rectangle.h);
			
			// add triangle under rectangle to create point/arrow
			c.beginPath();
			c.moveTo(rectangle.x, rectangle.y + rectangle.h);
			c.lineTo(rectangle.x + rectangle.w, rectangle.y + rectangle.h);
			c.lineTo(rectangle.x + Math.round(rectangle.w / 2), rectangle.y + rectangle.h + 16);
			c.closePath();
			c.fill();
			
			
			// text
			c.fillStyle = "white";
			c.fillText(""+this.inlayFrets[inlayIndex], this.frets[this.inlayFrets[inlayIndex]].x, this.frets[this.inlayFrets[inlayIndex]].y - 50);
			
			
			// and draw a circle inlay UNDER the fretboard
			c.beginPath();
			c.arc(this.frets[this.inlayFrets[inlayIndex]].x, this.frets[this.frets.length-1].y + 20 + (inlayIndex), Math.floor(markerRadius * 0.5), 0, 2 * Math.PI);
			
			// fill with color
			c.fillStyle = "white";
			c.fill();
			
			// double dot it for the 12th fret
			if(this.inlayFrets[inlayIndex] == 12){
				c.beginPath();
				c.arc(this.frets[this.inlayFrets[inlayIndex]].x, this.frets[this.frets.length-1].y + 40 + (inlayIndex), Math.floor(markerRadius * 0.5), 0, 2 * Math.PI);
				c.fill();
			}
		}
		
		
		
		// draw current scale/selection information
		c.font = "bold 40px sans-serif";
		c.fillStyle = "white";
		c.textAlign = "left";
		c.textBaseline = "middle";
		c.fillText(currentScale + " " + nameNoteArray(currentNotes), 100, 100);
		c.strokeStyle = "limegreen";
		c.strokeText(currentScale + " " + nameNoteArray(currentNotes), 100, 100);
	}
	
	
	// return fret index of matching note, or -1 if note not found
	this.searchFret = function(octave, note, startingString, startingPosition){
		let startingFret = (startingString*(this.fretCount+1)) + startingPosition;
		let currentString = startingString;
		
		while(startingFret >= 0){
			for(var fretIndex = startingFret, endSearchIndex = fretIndex + (currentString == 3 ? 4 : 5);fretIndex<endSearchIndex;fretIndex++){
				if(this.frets[fretIndex].octave == octave && this.frets[fretIndex].note == note)
					return fretIndex;
				else
					console.log("not a match... searching for " + noteNames[note] + octave + ", and string " + (currentString+1) + " fret " + (fretIndex%(this.fretCount+1)) + " (" + noteNames[this.frets[fretIndex].note] + this.frets[fretIndex].octave + ") was not it.");
				
			}
			
			// next string upward
			startingFret -= this.fretCount+1;
			currentString--;
		}
		
		return -1;
	}
	
	
	this.markScale = function(scaleNotes){
		this.markers = [];
		
		// the root note is the last index of scaleNotes; bring it to index 0
		scaleNotesReorder = [];
		scaleNotesReorder.push(scaleNotes[scaleNotes.length-1]);
		for(var i = 0, len = scaleNotes.length-1;i<len;i++)
			scaleNotesReorder.push(scaleNotes[i]);
		scaleNotes = scaleNotesReorder;
		
		currentNotes = scaleNotes;
		
		if(showOnly1ScaleCheckbox.checked){
			
			let currentOctave = scaleNotes[0] < noteIndices['E'] ? 3 : 2;
			let startingString = 5;
			let startingFret = 0;
			
			console.log("DEBUG: drawing markers for notes: ", scaleNotes, " with starting octave of " + currentOctave + " and starting fret low Open E. There are " + scaleNotes.length + " notes in the scale.");
			
			let numberOfNotesInScale = scaleNotes.length;
			let lastNote = 0;
			
			// the fret index is like the hand position: determining the lower bound of fret number which will be searched across the fretboard. the upper bound is startingFret+4 inclusive.
			for(var noteIndex = 0;noteIndex < numberOfNotesInScale;noteIndex++){
				if(scaleNotes[noteIndex] < lastNote){ // wrapped past B to C, raise octave
					currentOctave++;
				}
				lastNote = scaleNotes[noteIndex];
				
				let fretIndex = this.searchFret(currentOctave, scaleNotes[noteIndex], startingString, startingFret);
				if(fretIndex == -1){
					console.log("Fret for " + noteNames[scaleNotes[noteIndex]] + " not found under conditions: ", currentOctave, scaleNotes[noteIndex], startingString, startingFret);
					break;
				}
			
				this.markers.push(new Marker("Blue", "" + (noteIndex+1), this.frets[fretIndex].x, this.frets[fretIndex].y), this.frets[fretIndex].note);
				
				// update starting position for next search
				currentOctave = this.frets[fretIndex].octave;
				startingString = Math.floor(fretIndex / (this.fretCount+1));
			}
			
		}
		
		else{
			// draw all notes in scale on the entire fretboard
			for(var fretIndex = 0, fretsLen = this.frets.length;fretIndex < fretsLen;fretIndex++){
				if(scaleNotes.indexOf(this.frets[fretIndex].note) >= 0){
					this.markers.push(new Marker(markerOctaveColorCode[this.frets[fretIndex].octave], showNoteNamesCheckbox.checked ? noteNames[this.frets[fretIndex].note] : "", this.frets[fretIndex].x, this.frets[fretIndex].y, this.frets[fretIndex].note));
				}
			}
		}
		
		this.draw();
	}
	
	this.addUserMarker = function(fretIndex){
		// SUGGESTION! soft deactivation of any enumerated scale as the 'current scale'. should also remove all but 1 unique note marker if current scale is not User-Specified Notes
		currentScale = "User-Specified Notes";
	
		this.markers.push(new Marker(markerOctaveColorCode[this.frets[fretIndex].octave], "", this.frets[fretIndex].x, this.frets[fretIndex].y, this.frets[fretIndex].note));
		
		this.draw();
	}
	
	this.removeSpecifiedMarker = function(markerIndex){
		this.markers.splice(markerIndex, 1);
		this.draw();
	}
	
	this.clearMarkers = function(){
		this.markers = [];
		this.draw();
	}
	
	this.allResourcesLoaded = function(){
		console.log("DEBUG: All resources loaded");
		//myCanvas.width = this.fretboardImage.naturalWidth;
		//myCanvas.height = this.fretboardImage.naturalHeight;
		myCanvas.width = document.body.clientWidth;
		myCanvas.height = document.body.clientHeight;
		
		this.draw();
		
		console.log("Canvas resolution: " + myCanvas.width + " x " + myCanvas.height);
		console.log("Canvas dimensions: " + myCanvas.clientWidth + " x " + myCanvas.clientHeight);
	}.bind(this);
	
	this.fretboardImage.onload = this.allResourcesLoaded;
	this.fretboardImage.src = "fretboard.jpg";
	console.log("DEBUG: resources set to be loaded");
}

function invokeMarkScale(){
	let root = rootSelectorComboBox.value;
	let scaleIndex = scaleSelectorComboBox.value;
	
	currentScale = root + " " + scales[scaleIndex].name;
	
	fretboard.markScale(
		enumerateScale(
			noteIndices[root], scales[scaleIndex].steps
		)
	);
}


function CustomCheckbox(checkedByDefault, text){

	var cb = document.createElement('div');
	cb.className = "customCheckbox";
	cb.checked = checkedByDefault;
	
	var span = document.createElement('span');
	span.innerHTML = text;
	
	var subDiv = document.createElement('div');
	subDiv.innerHTML = cb.checked ? "&#10004;" : " ";
	cb.childDiv = subDiv;
	
	cb.additionalFunction = function(){}
	
	cb.onclick = function(){
		this.checked = !this.checked;
		
		this.childDiv.innerHTML = this.checked ? "&#10004;" : " ";
		
		this.additionalFunction();
	}.bind(cb);
	
	cb.appendChild(span);
	cb.appendChild(subDiv);
	
	document.body.appendChild(cb);
	
	return cb;
	
}

// input [0,2,3] => output "[C, D, D#]"
function nameNoteArray(noteArray){
	let out = "[";
	
	if(noteArray.length == 0){
		out += "(empty)";
		
	}else{
		out += noteNames[noteArray[0]];
		
		for(var i = 1, len = noteArray.length;i < len;i++)
			out += ", " + noteNames[noteArray[i]];
			
	}
	
	out += "]";
	
	return out;
}

function init(){
	console.log('initialization started');
	
	scaleSelectorComboBox = document.getElementById('scaleSelectorComboBox');
	rootSelectorComboBox = document.getElementById('rootSelectorComboBox');
	myCanvas = document.getElementById('ScaleWizardCanvas');
	c = myCanvas.getContext('2d');
	
	// enumerate scaleSelectorComboBox
	for(var i = 0, len = scales.length;i < len;i++){
		let option = document.createElement('option');
		option.innerHTML = scales[i].name;
		option.value = i;
		scaleSelectorComboBox.appendChild(option);
	}
	
	scaleSelectorComboBox.selectedIndex = 1;
	
	showLeftHandedCheckbox = new CustomCheckbox(false, "Scale Player");
	showLeftHandedCheckbox.style.left = "680px";
	showLeftHandedCheckbox.additionalFunction = function(){
		if(this.checked){
			if(scalePlayer == undefined){
				scalePlayer = new ScalePlayer();
				window.addEventListener('beforeunload', ()=> scalePlayer.cleanup() ); // on page unload
				console.log("scale player initialized!");
			}
			console.log("scale player enabled");
		}else{
			console.log("scale player disabled");
		}
		
		scalePlayer.setEnabled(this.checked);
		console.log("scale player object: ", scalePlayer);
	}
	
	showOnly1ScaleCheckbox = new CustomCheckbox(false, "Single Scale");
	showOnly1ScaleCheckbox.style.left = "800px";
	
	showNoteNamesCheckbox = new CustomCheckbox(true, "Name Notes");
	showNoteNamesCheckbox.style.left = "920px";
	showNoteNamesCheckbox.additionalFunction = function(){
	
		// toggle names automatically when the checkbox is clicked
		
		for(var markerIndex = 0, len = fretboard.markers.length;markerIndex < len;markerIndex++){
			fretboard.markers[markerIndex].text = showNoteNamesCheckbox.checked ? noteNames[fretboard.markers[markerIndex].note] : "";
		}
		
		fretboard.draw();
	};
	
	fretboard = new Imagery();
	console.log("DEBUG: fretboard creation completed");
	
	currentScale = "C Major";
	
	// highlight a Major C scale
	fretboard.markScale(
		enumerateScale( noteIndices['C'], scalesByName['Major'].steps
	));
	
	console.log("DEBUG: C Major scale drawn");
	
	console.log("Scale Wizard initialized");
}




// module for keypress-based virtual instrument-like playback
class ScalePlayer {
    constructor() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.audioContext.createGain();
        this.masterGain.gain.value = 0.3; // Master volume
        this.masterGain.connect(this.audioContext.destination);
        
        this.activeNotes = new Map(); // Track active notes for polyphony
        this.enabled = false;
        
        // Keyboard mapping (3 rows = 3 octaves of scale)
        this.keyMap = {
            // Bottom row (octave 2)
            'z': 0, 'x': 1, 'c': 2, 'v': 3, 'b': 4, 'n': 5, 'm': 6,
            // Middle row (octave 3)
            'a': 7, 's': 8, 'd': 9, 'f': 10, 'g': 11, 'h': 12, 'j': 13, 'k': 14, 'l': 15,
            // Top row (octave 4)
            'q': 16, 'w': 17, 'e': 18, 'r': 19, 't': 20, 'y': 21, 'u': 22, 'i': 23, 'o': 24, 'p': 25
        };
        
        this.setupKeyboardListeners();
    }
    
    getCurrentScale() {
        const rootNote = this.getSelectedRoot(); // e.g., 'E'
        const scaleType = this.getSelectedScale(); // e.g., 'Major'
        
        return this.buildScaleFrequencies(rootNote, scaleType);
    }
	
	buildRootedPattern(steps){
		let fixed = [0]; // start with root note
		
		let accumulation = 0;
		for(var stepIndex = 0, stepCount = steps.length - 1;stepIndex < stepCount;stepIndex++){
			accumulation += steps[stepIndex];
			fixed.push(accumulation); // add semi-tone difference to next note in scale
		}
		
		return fixed; // exclude last member of steps which would be the root again
	}
    
    buildScaleFrequencies(root, scaleType) {
        // Note frequencies for octave starting at C2 (65.41 Hz)
        const noteFrequencies = {
            'C': 65.41, 'C#': 69.30, 'D': 73.42, 'D#': 77.78,
            'E': 82.41, 'F': 87.31, 'F#': 92.50, 'G': 98.00,
            'G#': 103.83, 'A': 110.00, 'A#': 116.54, 'B': 123.47
        };
        
        // Scale intervals (semitones from root)
        const scalePatterns = {
            'Major': [0, 2, 4, 5, 7, 9, 11],
            'Minor': [0, 2, 3, 5, 7, 8, 10],
            'Pentatonic Major': [0, 2, 4, 7, 9],
            'Pentatonic Minor': [0, 3, 5, 7, 10],
            'Blues': [0, 3, 5, 6, 7, 10],
            'Dorian': [0, 2, 3, 5, 7, 9, 10],
            'Phrygian': [0, 1, 3, 5, 7, 8, 10],
            'Lydian': [0, 2, 4, 6, 7, 9, 11],
            'Mixolydian': [0, 2, 4, 5, 7, 9, 10],
            'Locrian': [0, 1, 3, 5, 6, 8, 10]
        };
        
		const pattern = this.buildRootedPattern(scales[scaleSelectorComboBox.value].steps);
        const rootFreq = noteFrequencies[root];
        
        // Build 3+ octaves of the scale
        const frequencies = [];
        for (let octave = 0; octave < 4; octave++) {
            for (let interval of pattern) {
                const freq = rootFreq * Math.pow(2, octave + interval / 12);
                frequencies.push(freq);
            }
        }
        
        return frequencies.splice(2); // first two octaves are inaudible (frequency is too low)
    }
    
    createNote(frequency) {
        // Create a more musical sound using multiple oscillators (additive synthesis)
        const now = this.audioContext.currentTime;
        
        // Create gain node for this note
        const noteGain = this.audioContext.createGain();
        noteGain.gain.setValueAtTime(0, now);
        noteGain.gain.linearRampToValueAtTime(0.5, now + 0.01); // Quick attack
        noteGain.connect(this.masterGain);
        
        // Create multiple oscillators for a richer sound
        const oscillators = [];
        
        // Fundamental
        const osc1 = this.audioContext.createOscillator();
        osc1.type = 'triangle'; // Warmer than sine
        osc1.frequency.value = frequency;
        
        const osc1Gain = this.audioContext.createGain();
        osc1Gain.gain.value = 0.5;
        osc1.connect(osc1Gain);
        osc1Gain.connect(noteGain);
        oscillators.push(osc1);
        
        // Second harmonic (octave up, adds brightness)
        const osc2 = this.audioContext.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = frequency * 2;
        
        const osc2Gain = this.audioContext.createGain();
        osc2Gain.gain.value = 0.15;
        osc2.connect(osc2Gain);
        osc2Gain.connect(noteGain);
        oscillators.push(osc2);
        
        // Third harmonic (adds character)
        const osc3 = this.audioContext.createOscillator();
        osc3.type = 'sine';
        osc3.frequency.value = frequency * 3;
        
        const osc3Gain = this.audioContext.createGain();
        osc3Gain.gain.value = 0.08;
        osc3.connect(osc3Gain);
        osc3Gain.connect(noteGain);
        oscillators.push(osc3);
        
        // Start all oscillators
        oscillators.forEach(osc => osc.start(now));
        
        return { oscillators, noteGain };
    }
    
    playNote(keyIndex) {
        if (!this.enabled) return;
        
        const scale = this.getCurrentScale();
        if (keyIndex >= scale.length) return;
        
        const frequency = scale[keyIndex];
        const noteId = `note_${keyIndex}`;
        
        // Don't retrigger if already playing
        if (this.activeNotes.has(noteId)) return;
        
        const note = this.createNote(frequency);
        this.activeNotes.set(noteId, note);
    }
    
    stopNote(keyIndex) {
        const noteId = `note_${keyIndex}`;
        const note = this.activeNotes.get(noteId);
        
        if (!note) return;
        
        const now = this.audioContext.currentTime;
        
        // Fade out to avoid clicks
        note.noteGain.gain.cancelScheduledValues(now);
        note.noteGain.gain.setValueAtTime(note.noteGain.gain.value, now);
        note.noteGain.gain.linearRampToValueAtTime(0, now + 0.05);
        
        // Stop and cleanup after fade
        setTimeout(() => {
            note.oscillators.forEach(osc => {
                try {
                    osc.stop();
                    osc.disconnect();
                } catch (e) {
                    // Already stopped
                }
            });
            note.noteGain.disconnect();
            this.activeNotes.delete(noteId);
        }, 100);
    }
    
    setupKeyboardListeners() {
        document.addEventListener('keydown', (e) => {
            if (!this.enabled) return;
            
            const key = e.key.toLowerCase();
            if (key in this.keyMap && !e.repeat) {
                e.preventDefault();
                this.playNote(this.keyMap[key]);
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (!this.enabled) return;
            
            const key = e.key.toLowerCase();
            if (key in this.keyMap) {
                e.preventDefault();
                this.stopNote(this.keyMap[key]);
            }
        });
    }
    
    setEnabled(enabled) {
        this.enabled = enabled;
        
        // Stop all notes when disabled
        if (!enabled) {
            this.activeNotes.forEach((note, noteId) => {
                const keyIndex = parseInt(noteId.split('_')[1]);
                this.stopNote(keyIndex);
            });
        }
    }
    
    cleanup() {
        this.activeNotes.forEach((note) => {
            note.oscillators.forEach(osc => {
                try {
                    osc.stop();
                    osc.disconnect();
                } catch (e) {}
            });
            note.noteGain.disconnect();
        });
        this.activeNotes.clear();
        this.masterGain.disconnect();
        this.audioContext.close();
    }
    
    getSelectedRoot() {
		return rootSelectorComboBox.value; // ex: 'E'
    }
    
    getSelectedScale() {
		return scales[scaleSelectorComboBox.value].name; // ex: 'Major'
    }
}





</script>
